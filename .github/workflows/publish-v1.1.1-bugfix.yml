name: Publish CRAMC v1.1.1 Bugfix

on:
  workflow_run:
    workflows: ["CRAMC - Windows EXE and Linux AppImage"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-cramc-v1.1.1-bugfix
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested Windows and Linux builds
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create or find the v1.1.1-bugfix draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v1.1.1-bugfix
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "'"$TAG_NAME"'")' || true)"
          if [[ -z "$release_json" ]]; then
            gh release create "$TAG_NAME" --draft --title "CRAMC v1.1.1 Bugfix" --generate-notes --repo "$REPOSITORY"
            release_json="$(gh api "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "'"$TAG_NAME"'")')"
          fi
          release_id="$(jq -r '.id' <<< "$release_json")"
          draft="$(jq -r '.draft' <<< "$release_json")"
          if [[ "$draft" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v1.1.1-bugfix is already published; preserving existing release."
            exit 0
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download tested Windows build
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: CRAMC-Windows.exe
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested Linux build
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: CRAMC-Linux.AppImage
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify binaries and generate checksums
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/CRAMC-Windows.exe
          test -s release-assets/CRAMC-Linux.AppImage
          chmod 0755 release-assets/CRAMC-Linux.AppImage
          (cd release-assets && sha256sum CRAMC-Windows.exe CRAMC-Linux.AppImage > SHA256SUMS.txt)

      - name: Upload release assets
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload v1.1.1-bugfix release-assets/CRAMC-Windows.exe release-assets/CRAMC-Linux.AppImage release-assets/SHA256SUMS.txt --clobber --repo "$REPOSITORY"

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false
          echo "CRAMC v1.1.1 Bugfix published."
