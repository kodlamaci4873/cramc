name: Publish CRAMC v1.1.1 Bugfix

on:
  workflow_run:
    workflows: ["CRAMC - Windows EXE and Linux AppImage"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-cramc-v1.1.1-bugfix
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested Windows and Linux builds
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find or create the v1.1.1 Bugfix draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v1.1.1-bugfix
        shell: bash
        run: |
          set -euo pipefail

          # gh release list includes drafts unless --exclude-drafts is requested.
          existing="$(gh release list --repo "$REPOSITORY" --limit 100 \
            --json tagName,isDraft,name \
            | jq -c --arg tag "$TAG_NAME" '.[] | select(.tagName == $tag)' || true)"

          if [[ -z "$existing" ]]; then
            gh release create "$TAG_NAME" \
              --draft \
              --title "CRAMC v1.1.1 Bugfix" \
              --generate-notes \
              --repo "$REPOSITORY"
          fi

          release_json="$(gh release view "$TAG_NAME" --repo "$REPOSITORY" \
            --json databaseId,isDraft,tagName,name)"
          actual_tag="$(jq -r '.tagName' <<< "$release_json")"
          release_id="$(jq -r '.databaseId' <<< "$release_json")"
          draft="$(jq -r '.isDraft' <<< "$release_json")"

          if [[ "$actual_tag" != "$TAG_NAME" || -z "$release_id" || "$release_id" == "null" ]]; then
            echo "Could not verify the intended release; refusing to publish."
            exit 1
          fi

          if [[ "$draft" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG_NAME is already published; preserving the existing release."
            exit 0
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Found draft release $TAG_NAME (ID $release_id)."

      - name: Download tested Windows build
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: CRAMC-Windows.exe
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested Linux build
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: CRAMC-Linux.AppImage
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify binaries and generate checksums
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/CRAMC-Windows.exe
          test -s release-assets/CRAMC-Linux.AppImage
          chmod 0755 release-assets/CRAMC-Linux.AppImage
          (cd release-assets && sha256sum CRAMC-Windows.exe CRAMC-Linux.AppImage > SHA256SUMS.txt)
          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Upload release assets
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.1.1-bugfix \
            release-assets/CRAMC-Windows.exe \
            release-assets/CRAMC-Linux.AppImage \
            release-assets/SHA256SUMS.txt \
            --clobber \
            --repo "$REPOSITORY"

      - name: Publish verified release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.1.1-bugfix --draft=false --prerelease=false --repo "$REPOSITORY"
          gh release view v1.1.1-bugfix --json tagName,isDraft,assets --repo "$REPOSITORY"
          echo "CRAMC v1.1.1 Bugfix published."
