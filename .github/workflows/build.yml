name: Build CRAMC Windows & Linux

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil

      - name: Build single-file Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CRAMC-Windows --uac-admin --collect-all psutil cramc.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRAMC-Windows-EXE
          path: dist/CRAMC-Windows.exe

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk binutils
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build single-file Linux application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CRAMC-Linux cramc.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRAMC-Linux-Binary
          path: dist/CRAMC-Linux
