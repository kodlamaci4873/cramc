name: Publish CRAMC v1.1.0

on:
  workflow_run:
    workflows: ["CRAMC - Windows EXE and Linux AppImage"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-cramc-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tested Windows and Linux builds
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirm the v1.1.0 draft is still waiting
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$REPOSITORY/releases/tags/$TAG_NAME")"
          release_id="$(jq -r '.id' <<< "$release_json")"
          draft="$(jq -r '.draft' <<< "$release_json")"

          if [[ "$draft" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "The v1.1.0 release is already published; nothing to do."
            exit 0
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the successful Windows EXE
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: CRAMC-Windows.exe
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the successful Linux AppImage
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: CRAMC-Linux.AppImage
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both binaries and create SHA-256 checksums
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/CRAMC-Windows.exe
          test -s release-assets/CRAMC-Linux.AppImage
          chmod 0755 release-assets/CRAMC-Linux.AppImage
          (cd release-assets && sha256sum CRAMC-Windows.exe CRAMC-Linux.AppImage > SHA256SUMS.txt)
          ls -lh release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Remove source files previously attached to the draft
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | startswith("CRAMC_v1.1.0_")) | .id' |
          while read -r asset_id; do
            [[ -z "$asset_id" ]] && continue
            gh api --silent --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id"
          done

      - name: Upload Windows, Linux and checksum assets
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" \
            release-assets/CRAMC-Windows.exe \
            release-assets/CRAMC-Linux.AppImage \
            release-assets/SHA256SUMS.txt \
            --clobber \
            --repo "$REPOSITORY"

      - name: Publish v1.1.0
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false
          echo "CRAMC v1.1.0 has been published with both platform builds."
